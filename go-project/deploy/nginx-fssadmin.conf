# FssAdmin (go-project) 反向代理 + 前端静态站点
# 占位符由 deploy/deploy.sh 自动渲染；手工使用时先替换：
#   __DOMAIN__    -> 你的域名，例如 admin.example.com
#   __WEB_ROOT__  -> 前端 dist 目录，例如 /var/www/fssadmin
#   __APP_PORT__  -> 后端端口，默认 8181
# 渲染后放到 /etc/nginx/conf.d/fssadmin.conf，然后 nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # 前端构建产物（web/dist）
    root __WEB_ROOT__;
    index index.html;

    # 与后端 server.clientMaxBodySize (64MB) 保持一致
    client_max_body_size 64m;
    client_body_timeout 300s;

    access_log /var/log/nginx/fssadmin.access.log;
    error_log  /var/log/nginx/fssadmin.error.log warn;

    # ---------- 前端 SPA ----------
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location ~* ^/assets/.*\.(js|css|woff2?|ttf|eot|svg|png|jpe?g|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- 后端 API（/api 前缀由后端中间件剥离） ----------
    location /api/ {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;   # 视频解析 / 下载接口耗时较长
        proxy_buffering       off;    # 避免大响应缓冲拖慢进度接口

        # 后端已开启 gzip（app.gzipEnable），此处不再重复压缩
        proxy_set_header Accept-Encoding $http_accept_encoding;
    }

    # ---------- 根路径接口（health / captcha 等未带 /api 前缀的地址） ----------
    location = /api.json { proxy_pass http://127.0.0.1:__APP_PORT__; proxy_set_header Host $host; }
    location = /docs     { proxy_pass http://127.0.0.1:__APP_PORT__; proxy_set_header Host $host; }
    location = /health   { proxy_pass http://127.0.0.1:__APP_PORT__; proxy_set_header Host $host; access_log off; }
    location ^~ /core/    { proxy_pass http://127.0.0.1:__APP_PORT__; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location ^~ /system/  { proxy_pass http://127.0.0.1:__APP_PORT__; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
    location ^~ /ws/ {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---------- 上传 / 视频 / 静态资源 ----------
    # 统一走 GoFrame 静态处理器，行为与直连后端一致。
    # 若追求吞吐，可改为 alias 直读，但需保证 nginx 运行用户对目录有读权限：
    #   location /uploads/ { alias /opt/fssadmin/static/upload/; }
    #   location /static/videos/ { alias /opt/fssadmin/static/videos/; }
    location ~ ^/(uploads|static)/ {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
}
