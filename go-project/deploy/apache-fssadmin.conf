# FssAdmin (go-project) Apache 反向代理 + 前端静态站点
# 占位符手工替换（deploy.sh 不渲染本文件）：
#   __DOMAIN__    -> 你的域名，例如 admin.example.com
#   __WEB_ROOT__  -> 前端 dist 目录，例如 /var/www/fssadmin
#   __APP_PORT__  -> 后端端口，默认 8181（本地开发是 8787）
#
# Debian/Ubuntu:
#   a2enmod proxy proxy_http proxy_wstunnel headers rewrite
#   放到 /etc/apache2/sites-available/fssadmin.conf 后 a2ensite fssadmin
# RHEL/Rocky:
#   放到 /etc/httpd/conf.d/fssadmin.conf（模块名 mod_proxy / mod_proxy_http / mod_proxy_wstunnel）
#
# 视频下载进度是 HTTP 轮询 GET /api/platform/video/progress ，不是 WebSocket。
# /ws/ 仅给 AI 聊天；配错不影响进度条。

<VirtualHost *:80>
    ServerName __DOMAIN__
    DocumentRoot __WEB_ROOT__

    <Directory "__WEB_ROOT__">
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
    LimitRequestBody 67108864
    Timeout 300
    ProxyTimeout 300

    # ---------- API：视频进度轮询走这里（普通 HTTP，不要 Upgrade）----------
    # nocanon：保留查询串 ids=；flushpackets=on：不要把短轮询 JSON 攒着
    ProxyPass        /api/  http://127.0.0.1:__APP_PORT__/api/  nocanon flushpackets=on
    ProxyPassReverse /api/  http://127.0.0.1:__APP_PORT__/api/

    ProxyPass        /core/ http://127.0.0.1:__APP_PORT__/core/
    ProxyPassReverse /core/ http://127.0.0.1:__APP_PORT__/core/
    ProxyPass        /system/ http://127.0.0.1:__APP_PORT__/system/
    ProxyPassReverse /system/ http://127.0.0.1:__APP_PORT__/system/

    ProxyPass        /health     http://127.0.0.1:__APP_PORT__/health
    ProxyPass        /api.json   http://127.0.0.1:__APP_PORT__/api.json
    ProxyPass        /docs       http://127.0.0.1:__APP_PORT__/docs

    ProxyPass        /uploads/ http://127.0.0.1:__APP_PORT__/uploads/
    ProxyPass        /static/  http://127.0.0.1:__APP_PORT__/static/

    # ---------- 仅 AI 聊天。Apache 2.4.47+ ----------
    ProxyPass        /ws/  ws://127.0.0.1:__APP_PORT__/ws/  upgrade=websocket timeout=3600
    ProxyPassReverse /ws/  ws://127.0.0.1:__APP_PORT__/ws/

    # Apache 2.4.46 及更早没有 upgrade=websocket 时，注释掉上面两行，改用：
    # RewriteEngine On
    # RewriteCond %{HTTP:Upgrade} websocket [NC]
    # RewriteCond %{HTTP:Connection} upgrade [NC]
    # RewriteRule ^/ws/(.*)$  ws://127.0.0.1:__APP_PORT__/ws/$1 [P,L]
    # ProxyPass        /ws/  http://127.0.0.1:__APP_PORT__/ws/
    # ProxyPassReverse /ws/  http://127.0.0.1:__APP_PORT__/ws/

    # Debian/Ubuntu: /var/log/apache2 ；RHEL/Rocky: /var/log/httpd
    ErrorLog  /var/log/apache2/fssadmin.error.log
    CustomLog /var/log/apache2/fssadmin.access.log combined
</VirtualHost>
